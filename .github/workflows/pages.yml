name: Publish nquantum Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nquantum-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check site files
        run: |
          test -s docs/index.html
          test -s docs/app.js
          test -s docs/styles.css
          test -s docs/data/research.json
          node --check docs/app.js
          python -m json.tool docs/data/research.json >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  deploy:
    name: Deploy static site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Verify published website
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check public homepage and research data
        run: |
          set -euo pipefail
          base="https://bestnathan.github.io/nquantum"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "$base/" -o /tmp/nquantum-index.html
          grep -Fq 'id="app-content"' /tmp/nquantum-index.html
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "$base/data/research.json" -o /tmp/nquantum-research.json
          python - <<'PY'
          import json
          with open('/tmp/nquantum-research.json', encoding='utf-8') as file:
              data = json.load(file)
          assert len(data["tracks"]) == 6, "Expected six research tracks"
          assert len(data["hardware"]) == 5, "Expected five hardware routes"
          assert len(data["metrics"]) == 12, "Expected twelve metric definitions"
          print("Homepage and research JSON are publicly accessible")
          PY
